<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Finder • Studio</title>
    <!-- Google Fonts for an elegant, editorial aesthetic -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Instrument+Serif:ital@1&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: #faf8f5; /* Warm, aesthetic off-white */
            color: #2b2b2b;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        header h1 {
            font-family: 'Instrument Serif', serif;
            font-size: 3.5rem;
            font-style: italic;
            color: #bd3a42; /* Pinterest-inspired muted red */
            margin-bottom: 8px;
        }

        header p {
            font-size: 1rem;
            color: #767676;
            letter-spacing: -0.2px;
        }

        .search-container {
            display: flex;
            justify-content: center;
            margin-bottom: 50px;
            gap: 12px;
        }

        .search-container input {
            width: 360px;
            padding: 14px 20px;
            font-size: 15px;
            border: 1px solid #e2ded9;
            background-color: #ffffff;
            border-radius: 30px; /* Pinterest rounded pill shape */
            outline: none;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }

        .search-container input:focus {
            border-color: #bd3a42;
            box-shadow: 0 4px 12px rgba(189, 58, 66, 0.08);
        }

        .search-container button {
            padding: 14px 28px;
            font-size: 15px;
            background-color: #bd3a42;
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .search-container button:hover {
            background-color: #a12f36;
            transform: translateY(-1px);
        }

        .message {
            text-align: center;
            font-size: 15px;
            color: #767676;
            margin-bottom: 30px;
            font-style: italic;
        }

        .recipes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 30px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .recipe-card {
            background: #ffffff;
            border-radius: 24px; /* Soft, smooth corners */
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid #f0ede9;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .recipe-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
        }

        .image-wrapper {
            position: relative;
            width: 100%;
            height: 280px;
            overflow: hidden;
        }

        .recipe-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .recipe-card:hover img {
            transform: scale(1.03);
        }

        .tag {
            position: absolute;
            bottom: 16px;
            left: 16px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(4px);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            color: #2b2b2b;
        }

        .recipe-content {
            padding: 28px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .recipe-content h2 {
            font-size: 1.6rem;
            margin-bottom: 12px;
            color: #111111;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .section-title {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #bd3a42;
            margin-top: 20px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .ingredients-list {
            list-style: none;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 10px;
        }

        .ingredients-list li {
            background-color: #f7f4f0;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 13px;
            color: #555;
        }

        .instructions-text {
            font-size: 14px;
            line-height: 1.6;
            color: #555;
            max-height: 180px;
            overflow-y: auto;
            padding-right: 8px;
        }

        /* Clean scrollbar design */
        .instructions-text::-webkit-scrollbar {
            width: 4px;
        }
        .instructions-text::-webkit-scrollbar-thumb {
            background-color: #e2ded9;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <header>
        <h1>the recipe corner</h1>
        <p>Search any dish and pick your favorite of two minimalist kitchen concepts.</p>
    </header>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="What are you craving today?" />
        <button onclick="searchRecipes()">Find concepts</button>
    </div>

    <div id="message" class="message"></div>
    <div id="recipesGrid" class="recipes-grid"></div>

    <script>
        async function searchRecipes() {
            const query = document.getElementById('searchInput').value.trim();
            const grid = document.getElementById('recipesGrid');
            const message = document.getElementById('message');

            grid.innerHTML = '';
            message.textContent = 'Curating options...';

            if (!query) {
                message.textContent = 'Please enter a dish name to begin.';
                return;
            }

            try {
                const response = await fetch(`https://themealdb.com{query}`);
                const data = await response.json();

                if (!data.meals) {
                    message.textContent = `We couldn't find recipes for "${query}". Try another visual tag.`;
                    return;
                }

                message.textContent = `Two matching kitchen concepts for "${query}":`;

                const topTwoRecipes = data.meals.slice(0, 2);

                topTwoRecipes.forEach(meal => {
                    // Extract ingredients list dynamically
                    const ingredients = [];
                    for (let i = 1; i <= 20; i++) {
                        const ingredient = meal[`strIngredient${i}`];
                        const measure = meal[`strMeasure${i}`];
                        if (ingredient && ingredient.trim() !== "") {
                            ingredients.push(`${measure ? measure.trim() : ''} ${ingredient.trim()}`);
                        }
                    }

                    const card = document.createElement('div');
                    card.className = 'recipe-card';
                    card.innerHTML = `
                        <div class="image-wrapper">
                            <img src="${meal.strMealThumb}" alt="${meal.strMeal}" />
                            <span class="tag">${meal.strArea} • ${meal.strCategory}</span>
                        </div>
                        <div class="recipe-content">
                            <h2>${meal.strMeal}</h2>
                            
                            <div class="section-title">Ingredients</div>
                            <ul class="ingredients-list">
                                ${ingredients.slice(0, 6).map(ing => `<li>${ing}</li>`).join('')}
                                ${ingredients.length > 6 ? `<li>+ ${ingredients.length - 6} more</li>` : ''}
                            </ul>

                            <div class="section-title">Steps</div>
                            <p class="instructions-text">${meal.strInstructions}</p>
                        </div>
                    `;
                    grid.appendChild(card);
                });

            } catch (error) {
                message.textContent = 'Connection error. Please try again.';
            }
        }
    </script>
</body>
</html>
